name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

# what runs without a Strix Halo: the host library and its tests, the text layer against llama.cpp's and Python's
# fixtures, osmos-api against a scripted engine, the installer, the sanitizers, and the GPU code compiled for gfx1151.
# the GPU and whole-model tests run on the box (make gpu-tests; DESIGN.md's protocol).

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # the models' first shards (their metadata and tokenizers: DeepSeek's and Qwen's), pinned and SHA-checked, and
      # the Qwen template's renderer (jinja2, gguf-py) - so the tests that read them never skip here
      - name: the tokenizers' shards
        run: tools/ci/fetch_shards.sh
      - name: the Qwen template's renderer
        run: python3 -m pip install --quiet --break-system-packages jinja2==3.1.4 gguf==0.17.1
      - name: tests
        run: make -j tests
      - name: osmos-api
        run: |
          export OSMOS_GGUF_PY="$(python3 -c 'import gguf, os; print(os.path.dirname(os.path.dirname(gguf.__file__)))')"
          make -j api && python3 tests/api/test_api.py
      - name: the installer
        run: python3 tools/install/test_install.py

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # libevt: built into libosmos.a, so under the sanitizers too
      - name: the tokenizers' shards # the tests that read them run under the sanitizers too (0.7.1: none fetched)
        run: tools/ci/fetch_shards.sh
      - name: AddressSanitizer + UndefinedBehaviorSanitizer
        run: make asan
      - name: ThreadSanitizer
        run: make tsan

  gpu-build:
    runs-on: ubuntu-latest
    container: rocm/dev-ubuntu-24.04:7.2
    steps:
      - name: the build's tools
        run: apt-get update -qq && apt-get install -y -qq git make gcc g++ > /dev/null
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: the GPU library, osmos-serve and the GPU tests, compiled for gfx1151
        run: make -j"$(nproc)" lib/libosmos.a lib/libosmos_hip.a && make -j"$(nproc)" gpu-build
