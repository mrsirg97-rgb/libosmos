name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

# what runs without a Strix Halo: the host library and its tests, the text layer against llama.cpp's and Python's
# fixtures, osmos-api against a scripted engine, the installer, the sanitizers, and the GPU code compiled for gfx1151.
# the GPU and whole-model tests run on the box (make gpu-tests; DESIGN.md's protocol).

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # the model's first shard is its metadata and tokenizer (5.8 MB): the tokenizer, chat and osmos-api tests read
      # it. fetched at the manifest's pinned commit and checked against its SHA-256, so the tests never skip here
      - name: the tokenizer's shard
        run: |
          set -eu
          read -r repo rev path sha < <(python3 -c 'import json; e = json.load(open("tools/install/packs.json"))["files"]["ud-iq1_m-1"]; print(e["repo"], e["revision"], e["path"], e["sha256"])')
          dst="$HOME/Models/ds1017/UD-IQ1_M/$(basename "$path")"
          mkdir -p "$(dirname "$dst")"
          curl -fsSL -o "$dst" "https://huggingface.co/$repo/resolve/$rev/$path"
          echo "$sha  $dst" | sha256sum -c
      - name: tests
        run: make -j tests
      - name: osmos-api
        run: make -j api && python3 tests/api/test_api.py
      - name: the installer
        run: python3 tools/install/test_install.py

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: AddressSanitizer + UndefinedBehaviorSanitizer
        run: make asan
      - name: ThreadSanitizer
        run: make tsan

  gpu-build:
    runs-on: ubuntu-latest
    container: rocm/dev-ubuntu-24.04:7.2
    steps:
      - name: the build's tools
        run: apt-get update -qq && apt-get install -y -qq git make gcc g++ > /dev/null
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: the GPU library, osmos-serve and the GPU tests, compiled for gfx1151
        run: make -j"$(nproc)" lib/libosmos.a lib/libosmos_hip.a && make -j"$(nproc)" gpu-build
