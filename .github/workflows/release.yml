name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # the tag is the code's version or nothing ships
      - name: assert the tag is OSMOS_VERSION
        run: |
          set -eu
          v="$(sed -n 's/^#define OSMOS_VERSION "\(.*\)"$/\1/p' include/osmos/version.h)"
          if [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "release: tag $GITHUB_REF_NAME is not v$v (include/osmos/version.h): not shipped" >&2
            exit 1
          fi

      # GitHub's own archives leave submodules out: the source with libevt in it, and its checksum
      - name: the source, libevt included
        run: |
          set -eu
          name="osmos-${GITHUB_REF_NAME#v}"
          mkdir -p dist
          git archive --prefix="$name/" -o "dist/$name.tar" HEAD
          (cd third_party/libevt && git archive --prefix="$name/third_party/libevt/" -o "../../dist/libevt.tar" HEAD)
          tar --concatenate -f "dist/$name.tar" dist/libevt.tar && rm dist/libevt.tar
          gzip -9n "dist/$name.tar"
          (cd dist && sha256sum *.tar.gz > checksums.txt)

      # the release's notes are CHANGELOG.md's section for it: none, no release
      - name: the changelog's section
        run: |
          set -eu
          v="${GITHUB_REF_NAME#v}"
          awk -v h="## [$v]" 'index($0, h) == 1 {on = 1; print; next} on && /^## \[/ {exit} on {print}' \
            CHANGELOG.md > dist/notes.md
          if [ "$(wc -l < dist/notes.md)" -lt 2 ]; then
            echo "release: CHANGELOG.md has no section ## [$v]: not shipped" >&2
            exit 1
          fi

      - name: the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          title="$(head -1 dist/notes.md | sed 's/^## //')"
          tail -n +2 dist/notes.md > dist/body.md
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt --title "osmos $title" \
            --notes-file dist/body.md
